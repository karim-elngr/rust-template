[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
yanked = "deny"
unmaintained = "workspace"
maximum-db-staleness = "P7D"
ignore = []

[licenses]
confidence-threshold = 0.93
include-dev = true
include-build = true
allow = [
    "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "MIT", "ISC",
    "BSD-2-Clause", "BSD-3-Clause", "Unicode-3.0", "Zlib",
    "OpenSSL", "CC0-1.0", "CDLA-Permissive-2.0", "BSL-1.0",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[bans.workspace-dependencies]
duplicates = "deny"
unused = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
