apiVersion: batch/v1
kind: CronJob
metadata:
  name: expire-pending-orders
spec:
  schedule: "*/5 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {app.kubernetes.io/name: cronjob, app.kubernetes.io/part-of: commerce}
        spec:
          restartPolicy: Never
          serviceAccountName: commerce
          automountServiceAccountToken: false
          terminationGracePeriodSeconds: 45
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: cronjob
              image: registry.example.invalid/commerce/cronjob:replace-me
              envFrom: [{configMapRef: {name: commerce-config}}]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: commerce-secrets, key: database-url}
              resources:
                requests: {cpu: 100m, memory: 64Mi}
                limits: {cpu: "1", memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: company-ca, mountPath: /etc/company-ca, readOnly: true}
          volumes:
            - name: company-ca
              configMap: {name: commerce-trust-bundle}
